<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>立地スコア | パスワード変更</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="header-logo">
                <a href="/" class="logo-link">立地スコア</a>
            </div>
            <div class="header-button">
                <a href="/">戻る</a>
            </div>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h2 class="login-title">パスワード変更</h2>
            <div>
                <div class="error-message" id="error"></div>
                <div class="success-message" id="success"></div>
                <form onsubmit="return false" id="password-form" class="login-form">
                    <div class="form-group">
                        <input type="password" name="current_password" placeholder="現在のパスワード" class="form-input">
                    </div>
                    <div class="form-group">
                        <input type="password" name="new_password" placeholder="新しいパスワード" class="form-input">
                    </div>
                    <div class="form-group">
                        <input type="password" name="new_password_confirm" placeholder="新しいパスワード（再）" class="form-input">
                    </div>
                    <button id="change-password" class="login-button">変更する</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        Copyright &copy; murakamikodai. 2025. 
    </footer>

    <script type="module" src="/js/password.js"></script>
</body>

</html>
